<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Parasol Hill – 100% paint strokes</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe6e4;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}
  canvas:active{cursor:grabbing}
  #title{position:fixed;left:16px;top:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);pointer-events:none}
  #title h1{margin:0;font:400 24px Georgia,serif;letter-spacing:.03em}
  #title div{font:600 10px system-ui,sans-serif;letter-spacing:.22em;opacity:.9;margin-top:2px}
  #hud{position:fixed;left:16px;top:66px;font:12px ui-monospace,Consolas,monospace;color:#fff;text-shadow:0 1px 2px #000;white-space:pre;pointer-events:none}
  #ui{position:fixed;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:64vw}
  .b{background:rgba(28,38,48,.55);color:#f6f1e4;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 10px;font:13px system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(4px)}
  .b:hover{background:rgba(28,38,48,.75)}
  select.b{appearance:none;padding-right:10px}
  #help{position:fixed;right:12px;bottom:10px;font:11px system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px #000;opacity:.85;pointer-events:none;text-align:right}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#e8e2cf;color:#46596a;font:16px Georgia,serif;z-index:9;transition:opacity .7s}
  #load small{font:12px system-ui,sans-serif;opacity:.7;margin-top:6px}
  #bar{width:260px;height:6px;background:#d2c9ae;border-radius:3px;margin-top:14px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:#4e7b98}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#e8e2cf;color:#6a3a2a;font:16px Georgia,serif;text-align:center;padding:24px;z-index:10}
  .touch{display:none}
  body.mobile .touch{display:block}
  #stick{position:fixed;left:22px;bottom:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4)}
  #knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55)}
  .tb{position:fixed;width:64px;height:64px;border-radius:50%;background:rgba(28,38,48,.5);color:#fff;border:1px solid rgba(255,255,255,.4);font:600 12px system-ui,sans-serif}
  #tJump{right:22px;bottom:28px}#tGust{right:96px;bottom:60px}
  body.photo #ui,body.photo #hud,body.photo #help,body.photo #title,body.photo .touch{display:none!important}
  body.nohud #hud{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><h1>Parasol Hill</h1><div>AFTER MONET · WOMAN WITH A PARASOL (1875) · 100% PAINT STROKES</div></div>
<div id="hud"></div>
<div id="ui">
  <button class="b" id="bAuto">Auto-walk Q</button>
  <button class="b" id="bTour">Camera tour T</button>
  <button class="b" id="bPhoto">Photo P</button>
  <button class="b" id="bGust">Wind gust E</button>
  <button class="b" id="bSound">Sound off</button>
  <select class="b" id="tier"><option value="auto">Quality: auto</option><option value="ultra">Ultra</option><option value="high">High</option><option value="medium">Medium</option><option value="mobile">Mobile</option></select>
  <button class="b" id="bHud">HUD H</button>
</div>
<div id="help">WASD walk · Shift run · Space jump · drag = look · wheel = zoom · E wind gust · Q auto · T tour · P photo · H HUD</div>
<div class="touch" id="stick"><div id="knob"></div></div>
<button class="touch tb" id="tJump">JUMP</button>
<button class="touch tb" id="tGust">WIND</button>
<div id="load">Preparing the palette…<div id="bar"><i></i></div><small id="ltxt">0 strokes</small></div>
<div id="err"></div>
<script>
'use strict';
/* =====================================================================
   Parasol Hill — a real-time 3D scene painted entirely with brush strokes,
   after Claude Monet's "Woman with a Parasol – Madame Monet and Her Son" (1875).
   Every visible pixel comes from an instanced, world-anchored stroke quad;
   there are no textures, models, fonts or image files.
   ===================================================================== */
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const IS_MOBILE = matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 820;
if (IS_MOBILE) document.body.classList.add('mobile');

/* ---------- deterministic random ---------- */
let SEED = +(Q.get('seed') || 1875);
function rnd() { SEED = SEED + 0x6D2B79F5 | 0; let t = Math.imul(SEED ^ SEED >>> 15, 1 | SEED); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a, b) => a + (b - a) * rnd();
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const mix = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* value noise */
function hash3(x, y, z) { let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 2147483647); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function vnoise(x, y, z = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const L = (a, b, t) => a + (b - a) * t;
  const c = (i, j, k) => hash3(xi + i, yi + j, zi + k);
  return L(L(L(c(0,0,0), c(1,0,0), u), L(c(0,1,0), c(1,1,0), u), v), L(L(c(0,0,1), c(1,0,1), u), L(c(0,1,1), c(1,1,1), u), v), w);
}
function fbm(x, y, z = 0, o = 4) { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f, z * f); f *= 2.03; a *= .5; } return s / (1 - Math.pow(.5, o)); }

/* ---------- terrain (mirrored exactly in GLSL) ---------- */
function H(x, z) {
  const dz = z - 22;
  return 9 * Math.exp(-(x * x + dz * dz) / 1400) + 1.2 * Math.sin(x * .045 + 1.3) * Math.sin(z * .038) + .5 * Math.sin(x * .13 + z * .09) - 2;
}
function Hn(x, z) { const e = .4; const nx = H(x - e, z) - H(x + e, z), nz = H(x, z - e) - H(x, z + e); const l = Math.hypot(nx, 2 * e, nz); return [nx / l, 2 * e / l, nz / l]; }

/* sun: low behind the hill on the left, so figures are backlit like the painting */
const SUN = (() => { const v = [-.45, .62, .64]; const l = Math.hypot(...v); return v.map(x => x / l); })();

/* ---------- palette ---------- */
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const lerp3 = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];
const jit = (c, j) => [clamp(c[0] + R(-j, j), 0, 1), clamp(c[1] + R(-j, j), 0, 1), clamp(c[2] + R(-j, j), 0, 1)];
const C = {
  zenith: hex('#3f6ea6'), skyMid: hex('#6f9cc6'), horizon: hex('#b7cfd9'), skyGreen: hex('#a9c7bf'),
  cloudLit: hex('#fbf6e6'), cloudWarm: hex('#f3e3c4'), cloudShade: hex('#9fb0c6'), cloudPink: hex('#e9d4d0'),
  grassDeep: hex('#4f6e33'), grass: hex('#7a9440'), grassLit: hex('#bdb85a'), straw: hex('#d7c879'), olive: hex('#8a8a4a'),
  flowerY: hex('#f1d64a'), flowerW: hex('#f4f0e2'), flowerR: hex('#d66a43'), flowerV: hex('#9b8cc4'),
  hillFar: hex('#8ea6b8'), hillMid: hex('#7d9a8e'), tree: hex('#3f5a46'), treeLit: hex('#7c955a'),
  dress: hex('#f2efe6'), dressWarm: hex('#f4e6c5'), dressShade: hex('#9aa8c8'), dressBlue: hex('#7d8fbf'),
  parasol: hex('#5d8a4a'), parasolLit: hex('#c9cf7a'), parasolIn: hex('#3d5f58'),
  skin: hex('#e7c3a0'), hair: hex('#5a4030'), veil: hex('#eef0ea'), hat: hex('#d9c38a'),
  boy: hex('#e9e2cf'), boyHat: hex('#d8b768'), boyDark: hex('#5d6680')
};

/* ---------- stroke batches: 32 bytes per stroke ----------
   0  f32x3 position (local/world, or sky direction)
   12 i8x4  tangent xyz + part id
   16 i8x4  normal xyz + unused
   20 u8x4  rgb + random
   24 u16x4 length/LMAX, width/WMAX, seed, lodKey               */
const LMAX = 48, WMAX = 12;
class Batch {
  constructor(cap) { this.cap = cap; this.n = 0; this.buf = new ArrayBuffer(cap * 32); this.f = new Float32Array(this.buf); this.i8 = new Int8Array(this.buf); this.u8 = new Uint8Array(this.buf); this.u16 = new Uint16Array(this.buf); }
  push(p, t, n, c, len, wid, part = 0) {
    if (this.n >= this.cap) return;
    const k = this.n++, f = k * 8, b = k * 32, s = k * 16;
    this.f[f] = p[0]; this.f[f + 1] = p[1]; this.f[f + 2] = p[2];
    const tl = Math.hypot(t[0], t[1], t[2]) || 1, nl = Math.hypot(n[0], n[1], n[2]) || 1;
    this.i8[b + 12] = Math.round(t[0] / tl * 127); this.i8[b + 13] = Math.round(t[1] / tl * 127); this.i8[b + 14] = Math.round(t[2] / tl * 127); this.i8[b + 15] = part;
    this.i8[b + 16] = Math.round(n[0] / nl * 127); this.i8[b + 17] = Math.round(n[1] / nl * 127); this.i8[b + 18] = Math.round(n[2] / nl * 127);
    this.u8[b + 20] = clamp(c[0], 0, 1) * 255; this.u8[b + 21] = clamp(c[1], 0, 1) * 255; this.u8[b + 22] = clamp(c[2], 0, 1) * 255; this.u8[b + 23] = rnd() * 255;
    this.u16[s + 12] = clamp(len / LMAX, 0, 1) * 65535; this.u16[s + 13] = clamp(wid / WMAX, 0, 1) * 65535; this.u16[s + 14] = rnd() * 65535; this.u16[s + 15] = rnd() * 65535;
  }
}

/* ---------- quality tiers ---------- */
const TIERS = { ultra: 1, high: .62, medium: .38, mobile: .24 };
const GEN_SCALE = IS_MOBILE ? .3 : 1;   // phones never generate more than they can draw
const COUNTS = { ground: 520e3, meadow: 360e3, near: 150e3, sky: 300e3, far: 110e3, woman: 36e3, boy: 12e3 };
for (const k in COUNTS) COUNTS[k] = Math.round(COUNTS[k] * (k === 'woman' || k === 'boy' ? 1 : GEN_SCALE));

/* ---------- generators (run in chunks so the progress bar moves) ---------- */
const MEADOW_R = 175;
function diskPoint(r) { const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * r; return [Math.cos(a) * d, Math.sin(a) * d]; }

function genGround(B, n) {           // flat underpaint following the slope
  for (let i = 0; i < n; i++) {
    const [x, z] = diskPoint(MEADOW_R);
    const nn = Hn(x, z);
    const patch = fbm(x * .025, z * .025, 3.1), fine = vnoise(x * .3, z * .3, 7);
    let c = lerp3(C.grassDeep, C.grass, smooth(.25, .7, patch));
    c = lerp3(c, C.grassLit, smooth(.55, .85, fine * .6 + patch * .5) * .8);
    if (rnd() < .08) c = lerp3(c, C.straw, .6);
    const a = .35 + (vnoise(x * .05, z * .05, 11) - .5) * 1.6;      // flow field: wind-combed
    const t = [Math.cos(a), 0, Math.sin(a)];
    t[1] = -(t[0] * nn[0] + t[2] * nn[2]) / nn[1];
    B.push([x, .03, z], t, nn, jit(c, .035), R(.9, 1.9), R(.22, .42));
  }
}
function genMeadow(B, n) {           // upright grass, wheat-like tufts and flowers
  for (let i = 0; i < n; i++) {
    const [x, z] = diskPoint(MEADOW_R);
    const patch = fbm(x * .03, z * .03, 5.7);
    let c = lerp3(C.grass, C.grassLit, rnd() * .7), len = R(.35, .8), wid = R(.06, .12), up = .5;
    const fl = rnd();
    if (fl < .05 && patch > .45) { c = C.flowerY; len = R(.12, .2); wid = R(.08, .12); up = .55; }
    else if (fl < .075) { c = C.flowerW; len = R(.1, .18); wid = R(.07, .1); up = .5; }
    else if (fl < .085) { c = C.flowerR; len = R(.1, .16); wid = R(.07, .1); up = .45; }
    else if (fl < .092) { c = C.flowerV; len = R(.1, .16); wid = R(.06, .1); up = .45; }
    else if (fl < .2) { c = lerp3(C.straw, C.olive, rnd() * .5); }
    const lean = .35 + rnd() * .25;
    B.push([x, len * up, z], [lean, 1, lean * .35 + R(-.2, .2)], [SUN[0] * R(-.6, 1), .7, SUN[2] * R(-.6, 1)], jit(c, .04), len, wid, 0);
  }
}
const TILE = 34;
function genNear(B, n) {             // dense blades re-wrapped around the camera every frame
  for (let i = 0; i < n; i++) {
    const x = R(-TILE / 2, TILE / 2), z = R(-TILE / 2, TILE / 2);
    let c = lerp3(C.grass, C.grassLit, Math.pow(rnd(), .7));
    if (rnd() < .14) c = lerp3(C.straw, C.grassLit, rnd());
    if (rnd() < .025) c = [C.flowerY, C.flowerW, C.flowerR][(rnd() * 3) | 0];
    const len = R(.25, .75);
    B.push([x, len * .5, z], [R(-.15, .15), 1, R(-.15, .15)], [SUN[0] * R(-.5, 1), .8, SUN[2] * R(-.5, 1)], jit(c, .04), len, R(.035, .07), 0);
  }
}
function skyColor(d) {                // d = unit direction
  const el = Math.asin(clamp(d[1], -1, 1));
  let base = lerp3(C.horizon, C.skyMid, smooth(0, .35, el));
  base = lerp3(base, C.zenith, smooth(.35, 1.2, el));
  base = lerp3(base, C.skyGreen, (1 - smooth(0, .12, el)) * .35);
  // wind-stretched cumulus
  const az = Math.atan2(d[2], d[0]);
  const cl = fbm(az * 1.6 + el * 1.2, el * 5.2, 1.7, 5);
  const band = smooth(.02, .2, el) * (1 - smooth(.85, 1.3, el));
  const k = smooth(.48, .66, cl) * band;
  const sunDot = d[0] * SUN[0] + d[1] * SUN[1] + d[2] * SUN[2];
  let cloud = lerp3(C.cloudShade, C.cloudLit, smooth(.45, .85, cl + .25 * sunDot));
  cloud = lerp3(cloud, C.cloudWarm, smooth(.4, 1, sunDot) * .55);
  if (rnd() < .12) cloud = lerp3(cloud, C.cloudPink, .5);
  return { c: lerp3(base, cloud, k), cloud: k, flow: cl };
}
function genSky(B, n) {
  for (let i = 0; i < n; i++) {
    const y = R(-.06, 1), r = Math.sqrt(1 - y * y), a = rnd() * Math.PI * 2;
    const d = [Math.cos(a) * r, y, Math.sin(a) * r];
    const s = skyColor(d);
    const e = [-Math.sin(a), 0, Math.cos(a)];                         // east
    const nN = [d[1] * e[2] - d[2] * e[1], d[2] * e[0] - d[0] * e[2], d[0] * e[1] - d[1] * e[0]];
    const ang = .55 + (s.flow - .5) * 1.4 + s.cloud * .5;             // diagonal, wind-swept sweeps
    const t = [e[0] * Math.cos(ang) + nN[0] * Math.sin(ang), e[1] * Math.cos(ang) + nN[1] * Math.sin(ang), e[2] * Math.cos(ang) + nN[2] * Math.sin(ang)];
    B.push(d, t, [0, 0, 0], jit(s.c, .03), R(20, 42) * (1 - .35 * y), R(5.5, 9), 0);
  }
}
function genFar(B, n) {              // distant hills (with solid silhouettes) and tree clumps
  const hillN = Math.round(n * .62);
  for (let i = 0; i < hillN; i++) {
    const layer = rnd() < .55 ? 0 : 1;
    const th = rnd() * Math.PI * 2;
    const Rr = layer ? 300 : 235;
    const top = (layer ? 9 : 4) + (layer ? 11 : 7) * fbm(th * 2.2 + layer * 7, layer * 3, .5);
    const y = mix(-8, top, Math.pow(rnd(), .7));
    const pos = [Math.cos(th) * Rr, y, Math.sin(th) * Rr];
    let c = layer ? C.hillFar : lerp3(C.hillMid, C.grass, .35);
    c = lerp3(c, C.horizon, layer ? .3 : .1);
    c = lerp3(c, lerp3(c, [1, 1, 1], .25), smooth(top - 6, top, y));
    B.push(pos, [-Math.sin(th), R(-.25, .25), Math.cos(th)], [-Math.cos(th), .3, -Math.sin(th)], jit(c, .03), R(6, 12), R(2.2, 3.6), 0);
  }
  const clumps = [];
  for (let k = 0; k < 26; k++) { const th = rnd() * Math.PI * 2, d = R(120, 190); clumps.push([Math.cos(th) * d, Math.sin(th) * d, R(4, 9), R(7, 16)]); }
  for (let i = hillN; i < n; i++) {
    const cl = clumps[(rnd() * clumps.length) | 0];
    const u = rnd() * Math.PI * 2, v = Math.acos(R(-1, 1));
    const nx = Math.sin(v) * Math.cos(u), ny = Math.cos(v), nz = Math.sin(v) * Math.sin(u);
    const base = H(cl[0], cl[1]);
    const p = [cl[0] + nx * cl[2], base + cl[3] * .55 + ny * cl[3] * .5, cl[1] + nz * cl[2]];
    const lit = nx * SUN[0] + ny * SUN[1] + nz * SUN[2];
    const c = lerp3(C.tree, C.treeLit, smooth(-.2, .8, lit));
    B.push(p, [-nz, R(-.4, .4), nx], [nx, ny, nz], jit(c, .04), R(1.2, 2.6), R(.5, .9), 0);
  }
}

/* figures: strokes sampled on simple surfaces, in local space (y up, facing +z) */
function surfaceStrokes(B, n, f, part) { for (let i = 0; i < n; i++) { const s = f(rnd(), rnd()); B.push(s.p, s.t, s.n, s.c, s.l, s.w, part); } }
function shade(base, warm, cool, n) {
  const d = n[0] * SUN[0] + n[1] * SUN[1] + n[2] * SUN[2];
  let c = lerp3(cool, base, smooth(-.35, .45, d));
  return lerp3(c, warm, smooth(.35, .9, d) * .6);
}
function genWoman(B) {
  const N = COUNTS.woman;
  // dress: flared cone, blown toward +x by the wind
  surfaceStrokes(B, N * .42 | 0, (u, v) => {
    const a = u * Math.PI * 2, y = v * 1.02;
    const r = mix(.47, .17, Math.pow(v, .8)) * (1 + .1 * Math.sin(a * 5 + v * 6));
    const blow = (1 - v) * .16 * (1 + Math.cos(a));
    const p = [Math.cos(a) * r + blow, y, Math.sin(a) * r];
    const n = [Math.cos(a), .25, Math.sin(a)];
    let c = shade(C.dress, C.dressWarm, C.dressShade, n);
    if (rnd() < .12) c = lerp3(c, C.dressBlue, .5);
    return { p, n, t: [R(-.05, .05) + .12 * (1 - v), 1, R(-.05, .05)], c: jit(c, .03), l: R(.12, .24), w: R(.03, .05) };
  }, 3);
  // bodice and shoulders
  surfaceStrokes(B, N * .14 | 0, (u, v) => {
    const a = u * Math.PI * 2, y = 1.0 + v * .42;
    const r = .16 * (1 - .25 * v) * (1 + .15 * Math.sin(v * Math.PI));
    const p = [Math.cos(a) * r * 1.15, y, Math.sin(a) * r];
    const n = [Math.cos(a), .1, Math.sin(a)];
    return { p, n, t: [-Math.sin(a), .5, Math.cos(a)], c: jit(shade(C.dress, C.dressWarm, C.dressShade, n), .03), l: R(.06, .11), w: R(.025, .04) };
  }, 0);
  // raised right arm towards the parasol handle
  surfaceStrokes(B, N * .05 | 0, (u, v) => {
    const A = [.16, 1.38, .02], Bp = [.2, 1.66, .16];
    const p0 = [mix(A[0], Bp[0], v), mix(A[1], Bp[1], v), mix(A[2], Bp[2], v)], a = u * Math.PI * 2;
    const n = [Math.cos(a), 0, Math.sin(a)];
    const p = [p0[0] + n[0] * .045, p0[1], p0[2] + n[2] * .045];
    return { p, n, t: [.04, .28, .14], c: jit(shade(C.dress, C.dressWarm, C.dressShade, n), .03), l: R(.06, .1), w: .025 };
  }, 0);
  // head, hair and straw hat
  surfaceStrokes(B, N * .06 | 0, (u, v) => {
    const a = u * Math.PI * 2, b = Math.acos(1 - 2 * v);
    const n = [Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a)];
    const p = [n[0] * .095, 1.58 + n[1] * .11, n[2] * .095];
    const face = n[2] > .2 && n[1] < .5;
    let c = face ? shade(C.skin, C.skin, lerp3(C.skin, C.dressShade, .5), n) : C.hair;
    if (n[1] > .55) c = shade(C.hat, C.hat, lerp3(C.hat, C.dressShade, .5), n);

/* ---------- simulation ---------- */
const PATH = s => { const x = mix(-16, 14, s); return [x, 9 + 7 * Math.sin(s * Math.PI) + 3 * Math.sin(s * 7)]; };
function update(dt) {
  S.t += dt;
  let mx = 0, mz = 0, run = keys['shift'];
  if (keys['w'] || keys['arrowup']) mz += 1; if (keys['s'] || keys['arrowdown']) mz -= 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1; if (keys['d'] || keys['arrowright']) mx += 1;
  if (stick.id !== null) { mx += stick.x; mz -= stick.y; }
  let vx = 0, vz = 0;
  if (S.auto) {
    S.pathS += S.pathDir * dt * .022;
    if (S.pathS > 1) { S.pathS = 1; S.pathDir = -1; } if (S.pathS < 0) { S.pathS = 0; S.pathDir = 1; }
    const [tx, tz] = PATH(S.pathS); const dx = tx - S.px, dz = tz - S.pz, l = Math.hypot(dx, dz);
    if (l > .05) { vx = dx / l * 1.15; vz = dz / l * 1.15; }

  } else if (mx || mz) {
    const l = Math.hypot(mx, mz); mx /= l; mz /= l;
    const fx = -Math.sin(S.yaw), fz = -Math.cos(S.yaw);             // camera forward on the ground
    const sp = run ? 4.2 : 1.7;
    vx = (fx * mz - fz * mx) * sp; vz = (fz * mz + fx * mx) * sp;
  }
  const sp = Math.hypot(vx, vz);
  S.speed = mix(S.speed, sp, 1 - Math.exp(-dt * 6));
  if (sp > .05) { const target = Math.atan2(vx, vz); let d = target - S.heading; d = Math.atan2(Math.sin(d), Math.cos(d)); S.heading += d * (1 - Math.exp(-dt * 6)); }
  S.px += vx * dt; S.pz += vz * dt;
  const r = Math.hypot(S.px, S.pz); if (r > MEADOW_R - 20) { S.px *= (MEADOW_R - 20) / r; S.pz *= (MEADOW_R - 20) / r; }
  S.vy -= 12 * dt; S.py += S.vy * dt;
  const g = H(S.px, S.pz); if (S.py <= g) { S.py = g; S.vy = 0; S.ground = true; }
  S.walkPh += dt * S.speed * 3.2;
  S.twirlV = mix(S.twirlV, .25, 1 - Math.exp(-dt * .8)); S.twirl += S.twirlV * dt;
  S.flutter = mix(S.flutter, 1, 1 - Math.exp(-dt * .7));
  if (S.auto && !drag) { let d = (S.heading + Math.PI) - S.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); S.yaw += d * (1 - Math.exp(-dt * .5)) * .5; }
}
function camera() {
  if (S.tour) {
    const a = S.t * .07, r = 24 + 10 * Math.sin(S.t * .05);
    const e = [Math.cos(a) * r, 0, 22 + Math.sin(a) * r]; e[1] = H(e[0], e[2]) + 2.2 + 2 * Math.sin(S.t * .11);
    return { eye: e, tgt: [0, H(0, 22) + 3.5, 22] };
  }
  const tgt = [S.px, S.py + 1.45, S.pz];
  const cp = Math.cos(S.pitch), e = [tgt[0] + Math.sin(S.yaw) * cp * S.dist, tgt[1] - Math.sin(S.pitch) * S.dist * .6, tgt[2] + Math.cos(S.yaw) * cp * S.dist];
  // low viewpoint, looking up at the figure against the sky — like the painting
  e[1] = Math.max(e[1], H(e[0], e[2]) + .35);
  return { eye: e, tgt: [tgt[0], tgt[1] + .35, tgt[2]] };
}

/* ---------- camera presets for verification ---------- */
const SHOTS = {
  wide: () => { S.tour = false; S.auto = false; S.px = -1; S.pz = 18; S.heading = Math.PI - .4; S.yaw = Math.PI - .15; S.pitch = .3; S.dist = 15; },
  hero: () => { S.tour = false; S.auto = false; S.px = -1; S.pz = 17; S.heading = Math.PI - .5; S.yaw = Math.PI - .25; S.pitch = .42; S.dist = 5.2; },
  closeup: () => { S.tour = false; S.auto = false; S.dist = 2.2; S.pitch = -.2; },
  sky: () => { S.tour = false; S.auto = false; S.pitch = -.35; S.dist = 6; },
  tour: () => { S.tour = true; }
};
window.__shot = id => { (SHOTS[id] || SHOTS.hero)(); S.py = H(S.px, S.pz); S.vy = 0; syncButtons(); };

/* ---------- render ---------- */
let last = performance.now(), fpsAcc = 0, fpsN = 0, benchT = 0, benchF = 0, scaleCool = 0;
function resize() {
  const dprCap = S.activeTier === 'mobile' ? 2 : 3;
  const dpr = Math.min(devicePixelRatio || 1, dprCap) * S.scale;
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
function drawLayer(L, kind, frac, lodDist) {
  const n = Math.min(L.n, Math.ceil(L.n * frac));
  gl.uniform1i(U.u_kind, kind); gl.uniform1f(U.u_lodDist, lodDist);
  gl.uniform1f(U.u_size, kind === 3 ? 1 : 1 / Math.sqrt(Math.max(frac, .05)));
  gl.bindVertexArray(L.vao); gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, n);
  return n;
}
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 20); last = now;
  if (!Q.has('freeze')) update(dt); else S.t += dt;
  // auto tier: short benchmark on the first frames, then dynamic resolution with hysteresis
  fpsAcc += dt; fpsN++;
  if (fpsAcc > .5) { S.fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
    if (S.tier === 'auto' && benchT < 3) { benchT += .5; benchF += S.fps; if (benchT >= 3) { const f = benchF / 6; S.activeTier = IS_MOBILE ? 'mobile' : f > 55 ? 'ultra' : f > 38 ? 'high' : f > 24 ? 'medium' : 'mobile'; } }
    scaleCool -= .5;
    if (scaleCool <= 0) { if (S.fps < 30 && S.scale > .6) { S.scale = Math.max(.6, S.scale - .1); scaleCool = 2; } else if (S.fps > 52 && S.scale < 1) { S.scale = Math.min(1, S.scale + .05); scaleCool = 3; } }
  }
  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(.86, .88, .86, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (!layers) { requestAnimationFrame(frame); return; }
  const { eye, tgt } = camera();
  const fov = 1.0, asp = canvas.width / canvas.height;
  const vp = mul(persp(fov, asp, .05, 2000), lookAt(eye, tgt, [0, 1, 0]));
  const frac = TIERS[S.activeTier] / (IS_MOBILE ? .3 : 1) * 1;
  const f = Math.min(frac, 1);
  gl.uniformMatrix4fv(U.u_vp, false, vp); gl.uniform3fv(U.u_cam, eye); gl.uniform1f(U.u_time, S.t);
  gl.uniform2f(U.u_res, canvas.width, canvas.height); gl.uniform1f(U.u_focal, 1 / Math.tan(fov / 2));
  gl.uniform1f(U.u_tile, TILE); gl.uniform4fv(U.u_gust, S.gust); gl.uniform3fv(U.u_sun, SUN);
  const px = canvas.height / 900;
  gl.uniform1f(U.u_pxMin, 1.6 * px); gl.uniform1f(U.u_pxMax, 26 * px);
  gl.uniform1f(U.u_bristles, S.activeTier === 'ultra' ? 28 : S.activeTier === 'high' ? 20 : S.activeTier === 'medium' ? 14 : 10);
  gl.uniform1f(U.u_dither, 1); gl.uniform1f(U.u_twirl, S.twirl); gl.uniform1f(U.u_flutter, S.flutter);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  let drawn = 0;
  // generations: sky → distant → underpaint → meadow → near blades → figures
  gl.depthMask(false); drawn += drawLayer(layers.sky, 2, f, 1); gl.depthMask(true);
  drawn += drawLayer(layers.far, 4, f, 140);
  gl.uniform1f(U.u_pxMax, 70 * px); drawn += drawLayer(layers.ground, 0, f, 26); gl.uniform1f(U.u_pxMax, 26 * px);
  drawn += drawLayer(layers.meadow, 0, f, 16);
  drawn += drawLayer(layers.near, 1, f, 1);
  // woman
  const bob = Math.abs(Math.sin(S.walkPh)) * .04 * Math.min(S.speed, 1.5);
  const lean = .05 + S.speed * .03;
  const M = modelM(S.px, S.py + bob, S.pz, S.heading, 1, lean);
  gl.uniformMatrix4fv(U.u_model, false, M);
  const axisL = [.12, .7, .06], al = Math.hypot(...axisL), ax = axisL.map(v => v / al);
  gl.uniform3fv(U.u_paraC, [.12, 2.0, .12]); gl.uniform3fv(U.u_paraAxis, ax);
  drawn += drawLayer(woman, 3, 1, 1);
  // boy — calm, watching
  const by = H(BOY.x, BOY.z);
  gl.uniformMatrix4fv(U.u_model, false, modelM(BOY.x, by, BOY.z, Math.atan2(S.px - BOY.x, S.pz - BOY.z), 1, Math.sin(S.t * 1.3) * .02));
  gl.uniform1f(U.u_twirl, 0);
  drawn += drawLayer(boy, 3, 1, 1);
  gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  if (S.hud) $('hud').textContent =
    `FPS ${S.fps.toFixed(0)}  ·  ${canvas.width}×${canvas.height} (×${S.scale.toFixed(2)})\n` +
    `Strokes ${(drawn / 1000).toFixed(0)}k drawn / ${(TOTAL / 1000).toFixed(0)}k  ·  tier ${S.activeTier}${S.tier === 'auto' ? ' (auto)' : ''}\n` +
    `Physics ${S.physics}  ·  ${S.tour ? 'tour' : S.auto ? 'auto-walk' : 'manual'}`;

  requestAnimationFrame(frame);
}
let TOTAL = 0;

/* ---------- build in chunks with a progress bar ---------- */
async function build() {
  const jobs = [
    ['sky', B => genSky(B, COUNTS.sky)], ['far', B => genFar(B, COUNTS.far)], ['ground', B => genGround(B, COUNTS.ground)],
    ['meadow', B => genMeadow(B, COUNTS.meadow)], ['near', B => genNear(B, COUNTS.near)], ['woman', genWoman], ['boy', genBoy]
  ];
  const out = {}; let done = 0; const all = Object.values(COUNTS).reduce((a, b) => a + b, 0);
  for (const [name, fn] of jobs) {
    const B = new Batch(COUNTS[name]);
    // generate in slices of ~60k strokes and yield so the page stays responsive
    const total = COUNTS[name];
    if (name === 'woman' || name === 'boy') fn(B);
    else { const slice = 60000; const whole = B.n; let made = 0;
      while (made < total) { const k = Math.min(slice, total - made); const tmp = { push: (...a) => B.push(...a) }; fnSlice(name, tmp, k); made += k;
        $('bar').firstElementChild.style.width = ((done + made) / all * 100).toFixed(1) + '%'; $('ltxt').textContent = `${((done + made) / 1000).toFixed(0)}k strokes`;
        await new Promise(r => setTimeout(r, 0)); } }
    done += total; out[name] = upload(B); TOTAL += B.n;
  }
  layers = { sky: out.sky, far: out.far, ground: out.ground, meadow: out.meadow, near: out.near };
  woman = out.woman; boy = out.boy;
  if (Q.has('shot')) window.__shot(Q.get('shot'));
  $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 800);
}
function fnSlice(name, B, k) { ({ sky: genSky, far: genFar, ground: genGround, meadow: genMeadow, near: genNear })[name](B, k); }

syncButtons();
requestAnimationFrame(frame);
build();
</script>
